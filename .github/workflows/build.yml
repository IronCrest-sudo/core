name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The reusable quality workflow checks out and runs repository code with a
# read-only token. Only the publish job receives write permission; it never
# checks out or executes repository code and consumes only the gated artifact.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A main-branch run may be waiting for release-environment approval. Never
  # cancel it with a newer push; other refs can safely keep only the latest run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  publish:
    name: Publish packs-latest
    needs: quality
    if: >
      needs.quality.outputs.verified == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    # Configure required reviewers on this environment to make publishing an
    # explicit approval rather than an automatic side effect of a green build.
    environment: release

    steps:
      - name: Download gated release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-packs
          path: release-assets

      - name: Verify downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.zip)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=No release assets::The gated artifact contained no ZIP files."
            exit 1
          fi

          empty=0
          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error title=Empty release asset::$file is zero bytes."
              empty=1
            fi
          done
          [ "$empty" -eq 0 ] || exit 1

          if [ ! -f release-assets/SHA256SUMS ]; then
            echo "::error title=Missing checksums::The gated artifact has no SHA256SUMS manifest."
            exit 1
          fi
          ( cd release-assets && sha256sum --check SHA256SUMS )

          {
            echo "# Release candidate"
            echo
            echo "Publishing ${#files[@]} gated ZIP artifact(s)."
            printf '%s\n' "${files[@]}" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish packs-latest
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: packs-latest
          name: Latest packs
          body: |
            Built by the read-only reusable quality workflow from the current
            `packs/` tree: individual pack archives plus the merged datapack.
            Publication only runs after the explicit quality gate succeeds and
            the configured `release` environment approves it.
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          make_latest: true
