name: AI Decision Bot

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  discussion:
    types: [created]
  schedule:
    - cron: "0 9 * * *" # Her gün UTC saati ile 09:00'da çalışır

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
      discussions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AI Decision
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const policy = "This organization is in maintenance pause until 2027-2028. New feature requests are rejected. Only critical security issues and simple bug fixes are considered. Always reply politely and briefly in English. Clearly state this is an automated system.";

            const event = context.eventName;
            let title = "";
            let body = "";
            let number = 0;
            let isDiscussion = false;

            if (event === "schedule") {
              console.log("Triggered by schedule. Skipping individual issue/PR processing.");
              return;
            } else if (event === "issues" || event === "issue_comment") {
              if (context.payload.issue) {
                title = context.payload.issue.title;
                body = context.payload.issue.body || "";
                number = context.payload.issue.number;
              }
            } else if (event === "pull_request" || event === "pull_request_review_comment") {
              const pr = context.payload.pull_request || context.payload.issue;
              if (pr) {
                title = pr.title || "PR Review Comment";
                body = context.payload.comment?.body || pr.body || "";
                number = pr.number;
              }
            } else if (event === "pull_request_review") {
              if (context.payload.pull_request) {
                title = context.payload.pull_request.title;
                body = context.payload.review?.body || "";
                number = context.payload.pull_request.number;
              }
            } else if (event === "discussion") {
              if (context.payload.discussion) {
                isDiscussion = true;
                title = context.payload.discussion.title;
                body = context.payload.discussion.body || "";
                number = context.payload.discussion.number;
              }
            }

            if (!number && !isDiscussion) {
              console.log("No valid number found for this event. Skipping.");
              return;
            }

            const prompt = `
            Policy:
            ${policy}

            Event: ${event}
            Title: ${title}
            Body: ${body}

            Decide what to do and reply with ONLY valid JSON in this exact format:
            {
              "action": "close" | "comment" | "label",
              "comment": "the short reply text in English",
              "labels": ["label1", "label2"]
            }
            `;

            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }]
                })
              }
            );

            const data = await response.json();
            let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";

            text = text.replace(/```json|```/g, "").trim();
            let decision;
            try {
              decision = JSON.parse(text);
            } catch {
              decision = {
                action: "comment",
                comment: "This is an automated system. Maintenance is paused until 2027-2028. Please fork the repository if you need changes.",
                labels: []
              };
            }

            const issue_number = number;

            // Discussions için ayrı API gerektirdiğinden genel issue yorumu ve etiketleme adımları atlanabilir veya uyarlanabilir
            if (!isDiscussion) {
              if (decision.comment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  body: decision.comment + "\n\n---\n*This message was generated by an automated AI system.*"
                });
              }

              if (decision.labels && decision.labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  labels: decision.labels
                });
              }

              if (decision.action === "close") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  state: "closed"
                });
              }
            } else {
              console.log("Discussion event processed. AI Decision comment/label logic can be extended if needed.");
            }
