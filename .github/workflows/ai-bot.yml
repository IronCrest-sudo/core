name: Ultimate Autonomous AI Agent

on:
  issues:
    types: [opened, reopened, edited]
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  discussion:
    types: [created]
  workflow_dispatch:
    inputs:
      task_description:
        description: 'What should the Ultimate AI Agent do?'
        required: true
        default: 'Analyze the repository, fix bugs, run tests, and create a PR.'

jobs:
  ultimate_agent:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      discussions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Configure Git Identity & Environment
        run: |
          git config --global user.name "Ultimate AI Agent"
          git config --global user.email "ai-agent-bot@users.noreply.github.com"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run Ultimate AI Agent Script
        uses: actions/github-script@v8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');

            try {
              console.log("==========================================");
              console.log("=== ULTIMATE AUTONOMOUS AI AGENT START ===");
              console.log("==========================================");

              const event = context.eventName;
              console.log("Event Type:", event);

              let taskInput = "";
              let issueNumber = null;
              let isDiscussion = false;

              if (event === "workflow_dispatch") {
                taskInput = context.payload.inputs.task_description;
              } else if (event === "issues" || event === "issue_comment") {
                if (context.payload.issue) {
                  issueNumber = context.payload.issue.number;
                  taskInput = `Issue #${issueNumber} - Title: ${context.payload.issue.title}\nBody: ${context.payload.issue.body || ""}`;
                }
              } else if (event === "pull_request" || event === "pull_request_review") {
                const pr = context.payload.pull_request;
                if (pr) {
                  issueNumber = pr.number;
                  taskInput = `PR #${issueNumber} - Title: ${pr.title}\nBody: ${pr.body || ""}`;
                }
              } else if (event === "discussion") {
                isDiscussion = true;
                taskInput = `Discussion Title: ${context.payload.discussion.title}\nBody: ${context.payload.discussion.body || ""}`;
              }

              console.log("Task Input Parsed:\n", taskInput);

              console.log("Scanning repository structure...");
              let fileStructure = "";
              try {
                fileStructure = execSync('find . -maxdepth 3 -not -path "*/.*" -not -path "./node_modules*"', { encoding: 'utf8' });
              } catch (e) {
                fileStructure = "Unable to scan file tree.";
              }

              const prompt = `
              You are an expert Principal Software Engineer and Autonomous AI Agent operating inside a GitHub Actions environment.
              You have full shell access, file read/write access, and analytical capabilities.

              Repository File Structure:
              ${fileStructure}

              Task / Request to Solve:
              ${taskInput}

              Instructions:
              1. Analyze the task and codebase structure.
              2. Determine if terminal shell commands or code modifications are required.
              3. Strictly avoid destructive commands (e.g., rm -rf /, modifying critical workflow security tokens).
              4. Return ONLY valid JSON in this exact format:
              {
                "thought_process": "Brief explanation of your technical plan",
                "shell_commands": ["command1", "command2"],
                "comment": "Professional explanation message to post on GitHub"
              }
              `;

              // Güncellenmiş model adı: gemini-3.8-flash
              console.log("Sending request to Gemini API (gemini-3.8-flash)...");
              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                  })
                }
              );

              if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`Gemini API Error (${response.status}): ${errorBody}`);
              }

              const data = await response.json();
              let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
              text = text.replace(/```json|```/g, "").trim();

              let decision;
              try {
                decision = JSON.parse(text);
              } catch (parseErr) {
                console.log("Warning: Failed to parse AI response as JSON. Falling back to default plan.");
                decision = {
                  thought_process: "Fallback execution due to JSON parse error.",
                  shell_commands: [],
                  comment: text
                };
              }

              console.log("AI Agent Thought Process:", decision.thought_process);
              console.log("Planned Shell Commands:", JSON.stringify(decision.shell_commands));

              const branchName = `ai-agent/fix-${Date.now()}`;
              let changesMade = false;

              if (decision.shell_commands && decision.shell_commands.length > 0) {
                console.log(`Creating isolated working branch: ${branchName}`);
                execSync(`git checkout -b ${branchName}`);

                for (const cmd of decision.shell_commands) {
                  if (cmd.includes("rm -rf /") || cmd.includes("sudo") || cmd.includes("git push origin main --force")) {
                    console.error(`BLOCKED DANGEROUS COMMAND: ${cmd}`);
                    continue;
                  }

                  console.log(`Executing command: ${cmd}`);
                  try {
                    const output = execSync(cmd, { encoding: 'utf8', stdio: 'pipe' });
                    console.log("Command Output:\n", output);
                  } catch (cmdErr) {
                    console.error(`Command failed: ${cmd}\nError:`, cmdErr.message);
                  }
                }

                const statusCheck = execSync('git status --porcelain', { encoding: 'utf8' });
                if (statusCheck.trim().length > 0) {
                  changesMade = true;
                }
              }

              if (changesMade) {
                console.log("Changes detected in repository files. Committing...");
                execSync('git add .');
                execSync(`git commit -m "AI Agent: Automated fix for issue/task execution"`);
                
                console.log(`Pushing branch ${branchName} to origin...`);
                execSync(`git push origin ${branchName}`);

                console.log("Creating automated Pull Request...");
                try {
                  const prTitle = `AI Agent Fix: Automated Resolution`;
                  const prBody = `This pull request was automatically generated by the Ultimate Autonomous AI Agent.\n\n**Task Details:**\n${taskInput}\n\n**Thought Process:**\n${decision.thought_process}`;
                  
                  const prCommand = `gh pr create --title "${prTitle}" --body "${prBody}" --head "${branchName}" --base main`;
                  const prOutput = execSync(prCommand, { encoding: 'utf8' });
                  console.log("Pull Request Created Successfully:\n", prOutput);
                } catch (prErr) {
                  console.error("Failed to create PR via CLI, falling back to manual notification:", prErr.message);
                }
              } else {
                console.log("No file changes were made by shell commands.");
              }

              if (issueNumber && !isDiscussion) {
                if (decision.comment) {
                  console.log(`Posting comment on Issue/PR #${issueNumber}...`);
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: decision.comment + "\n\n---\n*Executed autonomously by Ultimate AI Agent Bot.*"
                  });
                }
              }

              console.log("==========================================");
              console.log("=== ULTIMATE AUTONOMOUS AI AGENT FINISHED ===");
              console.log("==========================================");

            } catch (error) {
              console.error("FATAL ERROR in Ultimate AI Agent:", error);
              core.setFailed(error.message);
            }
