name: AI Agent

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      task_description:
        description: "What should the agent do?"
        required: true
        default: "Analyze the repository, run the audit and lint checks, and report findings."

# One run per issue/PR at a time; a newer push cancels the older run.
concurrency:
  group: ai-agent-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Authorization gate: only trusted actors can trigger the agent.
    #  - PRs from forks are skipped (no secrets there anyway).
    #  - Issues / comments / reviews need OWNER, MEMBER or COLLABORATOR.
    #  - Comments must start with "/agent" (also prevents bot-comment loops).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/agent') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Do not leave the token in .git/config; the script pushes with an explicit header.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set a repository variable GEMINI_MODEL to override the default model.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node .github/scripts/ai-agent.js
