name: AI Decision Bot

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  discussion:
    types: [created]
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # Runs every day at 09:00 UTC

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
      discussions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AI Decision
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            try {
              console.log("=== AI Decision Bot Started ===");
              console.log("Event Name:", context.eventName);

              if (!process.env.GEMINI_API_KEY) {
                throw new Error("CRITICAL: GEMINI_API_KEY environment variable is missing or empty!");
              }

              const policy = "This organization is in maintenance pause until 2027-2028. New feature requests are rejected. Only critical security issues and simple bug fixes are considered. Always reply politely and briefly in English. Clearly state this is an automated system.";

              const event = context.eventName;
              let title = "";
              let body = "";
              let number = 0;
              let isDiscussion = false;

              if (event === "schedule" || event === "push" || event === "workflow_dispatch") {
                console.log(`Triggered by ${event}. Skipping individual issue/PR processing.`);
                return;
              } else if (event === "issues" || event === "issue_comment") {
                if (context.payload.issue) {
                  title = context.payload.issue.title;
                  body = context.payload.issue.body || "";
                  number = context.payload.issue.number;
                }
              } else if (event === "pull_request" || event === "pull_request_review_comment") {
                const pr = context.payload.pull_request || context.payload.issue;
                if (pr) {
                  title = pr.title || "PR Review Comment";
                  body = context.payload.comment?.body || pr.body || "";
                  number = pr.number;
                }
              } else if (event === "pull_request_review") {
                if (context.payload.pull_request) {
                  title = context.payload.pull_request.title;
                  body = context.payload.review?.body || "";
                  number = context.payload.pull_request.number;
                }
              } else if (event === "discussion") {
                if (context.payload.discussion) {
                  isDiscussion = true;
                  title = context.payload.discussion.title;
                  body = context.payload.discussion.body || "";
                  number = context.payload.discussion.number;
                }
              }

              console.log(`Parsed Data -> Number: ${number}, Title: ${title}`);

              if (!number && !isDiscussion) {
                console.log("No valid number found for this event. Skipping.");
                return;
              }

              const prompt = `
              Policy:
              ${policy}

              Event: ${event}
              Title: ${title}
              Body: ${body}

              Decide what to do and reply with ONLY valid JSON in this exact format:
              {
                "action": "close" | "comment" | "label",
                "comment": "the short reply text in English",
                "labels": ["label1", "label2"]
              }
              `;

              console.log("Sending request to Gemini API...");
              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                  })
                }
              );

              if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Gemini API Error (${response.status}): ${errText}`);
              }

              const data = await response.json();
              console.log("Gemini API Response received successfully.");
              
              let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
              console.log("Raw AI Output:", text);

              text = text.replace(/```json|```/g, "").trim();
              let decision;
              try {
                decision = JSON.parse(text);
              } catch (parseError) {
                console.log("Failed to parse AI response as JSON. Falling back to default comment.", parseError);
                decision = {
                  action: "comment",
                  comment: "This is an automated system. Maintenance is paused until 2027-2028. Please fork the repository if you need changes.",
                  labels: []
                };
              }

              console.log("Decision parsed:", JSON.stringify(decision));
              const issue_number = number;

              if (!isDiscussion) {
                if (decision.comment) {
                  console.log(`Creating comment on issue/PR #${issue_number}...`);
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number,
                    body: decision.comment + "\n\n---\n*This message was generated by an automated AI system.*"
                  });
                }

                if (decision.labels && decision.labels.length > 0) {
                  console.log(`Adding labels to issue/PR #${issue_number}:`, decision.labels);
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number,
                    labels: decision.labels
                  });
                }

                if (decision.action === "close") {
                  console.log(`Closing issue/PR #${issue_number}...`);
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number,
                    state: "closed"
                  });
                }
              } else {
                console.log("Discussion event processed.");
              }
              console.log("=== AI Decision Bot Finished Successfully ===");
            } catch (error) {
              console.error("FATAL ERROR in AI Decision Bot:", error);
              setFailed(error.message);
            }
